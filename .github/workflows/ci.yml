name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slowfit_test
          POSTGRES_USER: slowfit
          POSTGRES_PASSWORD: slowfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slowfit -d slowfit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://slowfit:slowfit@localhost:5432/slowfit_test?schema=public
      TEST_DATABASE_URL: postgresql://slowfit:slowfit@localhost:5432/slowfit_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Apply database migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Backend integration tests
        run: npm run test:backend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser integration tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
